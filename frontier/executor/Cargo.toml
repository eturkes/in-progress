[package]
name = "frontier-executor"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[dependencies]
axum = { version = "=0.8.9", features = ["json", "tokio"] }
clap = { version = "=4.6.6", features = ["derive", "env"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["fmt"] }
uuid = { version = "=1.24.0", features = ["serde", "v4"] }

[dev-dependencies]
http-body-util = "=0.1.4"
tempfile = "=3.27.0"
tower = { version = "=0.5.3", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
